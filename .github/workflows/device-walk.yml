name: device-walk
# Trigger: push a branch named run/<anything> (edit request.json on it), or workflow_dispatch. Main is not a trigger.
# Results are committed to branch results/<branch-name> so anyone can `git fetch` them.
on:
  push:
    branches: ['run/**']
    paths: ['request.json', 'scripts/**', '.github/workflows/device-walk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  walk:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Walk in iOS Simulator
        id: walk
        run: scripts/run.sh out
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        continue-on-error: true
        timeout-minutes: 24
      - name: Publish results to results/<ref>-<sha>
        if: always()
        run: |
          BR="results/${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}"
          mkdir -p out
          # Previews are behind Access: encrypt everything to the public key before it leaves the runner.
          brew install age >/dev/null 2>&1
          mkdir -p sealed
          tar -C out -cf - . | age -R age-public-key.txt -o sealed/results.tar.age
          if [ $(stat -f%z sealed/results.tar.age) -gt 90000000 ]; then split -b 60m sealed/results.tar.age sealed/results.tar.age.part- && rm sealed/results.tar.age; fi  # join: cat results.tar.age.part-* > results.tar.age
          echo "outcome: ${{ steps.walk.outcome }}" > sealed/summary.txt
          # non-sensitive: target names, verdicts, covered seconds, probe id (no URLs, no page text)
          if [ -f out/pixel-summary.txt ]; then cat out/pixel-summary.txt >> sealed/summary.txt; else echo "pixel: no verdicts produced" >> sealed/summary.txt; fi
          rm -rf out; mv sealed out
          git config user.name "device-walk"; git config user.email "device-walk@users.noreply.github.com"
          git checkout --orphan "$BR"; git rm -rf --quiet . 2>/dev/null || true
          git add -f out; git commit -qm "results for $GITHUB_SHA (${{ steps.walk.outcome }})"
          git push origin "$BR"
      - name: Fail if walk failed
        if: steps.walk.outcome == 'failure'
        run: exit 1
